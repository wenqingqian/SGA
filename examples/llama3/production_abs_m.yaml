# SGA production preset "abs_m": the production-recommended
# configuration as a named four-field combination (evidence: the old
# workspace's 14-run online matrix — score ranking abs_m > abs_g > update
# ≈ coi, abs_m at 40% retention within the ≤1% relative loss-deviation
# criterion; see notes/online-matrix-evidence.md). Everything outside the
# sga: section mirrors examples/llama3/train_1b_dense.yaml so runs are
# directly comparable.
#
# score=abs_m (|pre-commit first moment|, EF-kernel-emitted at full syncs) +
# selection=topk method=adaptive (v3.1: fast-histogram warmup gated on the
# measured ratio, then a persistent threshold with the ±1pp dead band and
# log-space steps) + optimizer=adamw (residual) +
# backend=torch_pipelined_index with high_priority_group: true and S=3
# slices on a twin high-priority NCCL process group). Cycle start_iter=4 / period=4 with
# adaptive_warmup_syncs=5 (historical validation context: the transition was
# originally confirmed within a 60-iter smoke; the preset now runs
# train_iters=5000).

defaults:
  - _self_

experiment:
  exp_name: UNDEFINED
  exp_dir: UNDEFINED
  task:
    type: train
    backend: megatron
    entrypoint: ./sga/train_gpt.py
  runner:
    type: ssh
    backend: torchrun
    nnodes: 1
    nproc_per_node: 8
    ssh_port: 2222
    master_port: 29516
    no_shared_fs: false
    rdzv_backend: static
    hostfile: ./examples/llama3/hostfile.txt
  cmds:
    before_start: |
      source /root/miniconda3/etc/profile.d/conda.sh && conda activate flagscale
      source /workspace/sga_framework/SGA/env.sh --check
      export LD_LIBRARY_PATH=/root/miniconda3/envs/flagscale/lib:\${LD_LIBRARY_PATH}
      export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  envs:
    CUDA_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    NVTE_APPLY_QK_LAYER_SCALING: 0
    NVTE_ALLOW_NONDETERMINISTIC_ALGO: 0
    NCCL_DEBUG: WARN
    NCCL_IB_DISABLE: 0
    NCCL_IB_GID_INDEX: 3
    NCCL_NET_GDR_LEVEL: 5
    NCCL_P2P_DISABLE: 0
    NCCL_P2P_LEVEL: NVL
    GLOO_SOCKET_IFNAME: enp226s0
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra

sga:
  # Flat SGA arguments — the production preset shipped with the repo.
  sga_enabled: true
  sga_cycle_start_iter: 4
  sga_cycle_period: 4
  sga_score: abs_m
  sga_selection_method: adaptive
  sga_selection_ratio_percent: 40.0
  sga_selection_adaptive_warmup_syncs: 5
  sga_optimizer: adamw
  sga_optimizer_residual_mean: false
  sga_backend: torch_pipelined_index
  sga_backend_high_priority_group: true
  sga_backend_index_slices: 3

#### model ####

train:
  system:
    rerun_mode: disabled
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    disable_bias_linear: True
    use_flash_attn: True
    sequence_parallel: True
    use_distributed_optimizer: False
    data_parallel_sharding_strategy: no_shard
    precision:
      bf16: True
      attention_softmax_in_fp32: true
      accumulate_allreduce_grads_in_fp32: true
    logging:
      timing_log_level: 2
      log_interval: 1
      log_throughput: true
      log_params_norm: true
      log_num_zeros_in_grad: true
    checkpoint:
      save_interval: 100000

  model:
    transformer_impl: transformer_engine
    num_layers: 16
    hidden_size: 2048
    ffn_hidden_size: 8192
    num_attention_heads: 32
    seq_length: 2048
    group_query_attention: True
    num_query_groups: 8
    max_position_embeddings: 2048
    norm_epsilon: 1e-5
    use_rotary_position_embeddings: True
    swiglu: True
    normalization: RMSNorm
    position_embedding_type: rope
    rotary_base: 500000
    untie_embeddings_and_output_weights: True
    init_method_std: 0.02
    attention_dropout: 0.0
    hidden_dropout: 0.0
    clip_grad: 1.0
    train_iters: 5000
    exit_interval: 200
    eval_iters: 0
    eval_interval: 10000000
    micro_batch_size: 1
    global_batch_size: 8
    seed: 1234
    optimizer:
      weight_decay: 1e-2
      adam_beta1: 0.9
      adam_beta2: 0.95
      lr_scheduler:
        lr: 1.0e-5
        min_lr: 1.0e-6
        lr_warmup_fraction: 0.1
        lr_decay_style: cosine

  data:
    data_path: /workspace/sga_framework/data/openwebtext/openwebtext-meg-llama_text_document
    split: 1
    tokenizer:
      tokenizer_type: HuggingFaceTokenizer
      tokenizer_model: /workspace/sga_framework/data/llama3_dataset
      # bridge invariant: old Llama3TokenizerFS derived 64307 (base 64002 +
      # 305 added) -> padded 64320; new-fork HuggingFaceTokenizer reports
      # len() = 64002. --vocab-size is unused on this path, so the model vocab
      # must be pinned explicitly to the checkpoint/dataset value 64320.
      padded_vocab_size: 64320
      make_vocab_size_divisible_by: 64
